
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Mobile | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f33;--blue:#2388ff;--text:#edf5ff;--muted:#9bb0c9;--border:#263b55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:20px}
main{max-width:1050px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;color:#62aaff}h2{margin-top:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#071525;border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit}
textarea{min-height:85px;resize:vertical}
label{font-size:14px;color:var(--muted)}
button{border:0;border-radius:8px;padding:11px 15px;background:var(--blue);color:white;font-weight:bold;cursor:pointer;margin:3px}
button.secondary{background:#30435c}button.danger{background:#c83c4b}
button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#status{white-space:pre-wrap;margin:12px 0;color:#9ed0ff}
.product{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.product img{width:72px;height:72px;object-fit:cover;border-radius:9px;background:#071525}
.product-info{flex:1;min-width:0;overflow-wrap:anywhere}
.product-info p{margin:5px 0;color:var(--muted);font-size:14px}
.hidden{display:none!important}
#products{margin-top:12px}
@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.product{align-items:flex-start}.product img{width:58px;height:58px}.product button{padding:9px}}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Prime Mobile</h1>
    <p style="color:#9bb0c9;margin-bottom:0">Store Admin Dashboard</p>
  </div>
  <button id="logoutBtn" class="secondary hidden" type="button">Log Out</button>
</header>

<section id="loginPanel" class="panel">
  <h2>Admin Login</h2>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Admin email">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn" type="button">Log In</button>
</section>

<section id="dashboard" class="hidden">
  <section class="panel">
    <h2 id="formTitle">Add New Product</h2>
    <form id="productForm">
      <label for="name">Product Name *</label>
      <input id="name" required maxlength="150" placeholder="e.g. Moxom Fast Charger">

      <div class="grid">
        <div>
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="Accessories">Accessories</option>
            <option value="Phones">Phones</option>
            <option value="Recharge & Internet">Recharge & Internet</option>
            <option value="Services">Services</option>
          </select>
        </div>
        <div>
          <label for="price">Price (USD) *</label>
          <input id="price" type="number" min="0" step="0.01" required placeholder="8">
        </div>
      </div>

      <label for="description">Description</label>
      <textarea id="description" maxlength="2000" placeholder="Product details and warranty"></textarea>

      <label for="imageFile">Product Image (optional)</label>
      <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">

      <label for="image_url">Or Image URL</label>
      <input id="image_url" type="url" placeholder="https://...">

      <label for="stock_quantity">Stock Quantity</label>
      <input id="stock_quantity" type="number" min="0" step="1" value="1">

      <label><input id="is_active" type="checkbox" checked style="width:auto;margin:0 8px 0 0">Show product on store</label>
      <p id="status" role="status"></p>
      <button id="saveBtn" type="submit">Save Product</button>
      <button id="cancelBtn" class="secondary hidden" type="button">Cancel Edit</button>
      <button id="refreshBtn" class="secondary" type="button">Refresh Products</button>
    </form>
  </section>

  <section class="panel">
    <h2>Products</h2>
    <input id="filter" placeholder="Search products..." aria-label="Search products">
    <div id="products">Loading products...</div>
  </section>
</section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://jkdlqtmspsxssxpotnhr.supabase.co";

  // Paste your Supabase publishable key between the quotes below.
  // Use the sb_publishable_ key, NOT the service_role secret.
  const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

  const $ = id => document.getElementById(id);
  const status = message => $("status").textContent = message;
  let db = null;
  let editingId = null;
  let productCache = [];

  function showDashboard(signedIn) {
    $("loginPanel").classList.toggle("hidden", signedIn);
    $("dashboard").classList.toggle("hidden", !signedIn);
    $("logoutBtn").classList.toggle("hidden", !signedIn);
  }

  function resetForm() {
    editingId = null;
    $("productForm").reset();
    $("stock_quantity").value = 1;
    $("is_active").checked = true;
    $("formTitle").textContent = "Add New Product";
    $("saveBtn").textContent = "Save Product";
    $("cancelBtn").classList.add("hidden");
    status("");
    $("imageFile").value = "";
    $("image_url").value = "";
  }

  async function loadProducts() {
    $("products").textContent = "Loading products...";
    const { data, error } = await db.from("products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      $("products").textContent = "Could not load products: " + error.message;
      return;
    }

    productCache = data || [];
    renderProducts();
  }

  function renderProducts() {
    const query = $("filter").value.trim().toLowerCase();
    const shown = productCache.filter(p =>
      [p.name, p.category, p.description].join(" ").toLowerCase().includes(query)
    );

    $("products").replaceChildren();

    if (!shown.length) {
      $("products").textContent = "No products found.";
      return;
    }

    shown.forEach(p => {
      const card = document.createElement("article");
      card.className = "product";

      const img = document.createElement("img");
      img.alt = p.name || "Product";
      img.src = p.image_url || "";
      img.onerror = () => { img.style.display = "none"; };

      const info = document.createElement("div");
      info.className = "product-info";

      const title = document.createElement("strong");
      title.textContent = p.name || "Unnamed product";

      const details = document.createElement("p");
      details.textContent = `${p.category || ""} · $${Number(p.price || 0).toFixed(2)} · Stock: ${p.stock_quantity ?? 0}`;

      const active = document.createElement("p");
      active.textContent = p.is_active ? "Visible on store" : "Hidden from store";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit";
      edit.addEventListener("click", () => editProduct(p));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "Delete";
      del.addEventListener("click", () => deleteProduct(p));

      info.append(title, details, active, edit, del);
      card.append(img, info);
      $("products").append(card);
    });
  }

  function editProduct(p) {
    editingId = p.id;
    $("name").value = p.name || "";
    $("category").value = p.category || "Accessories";
    $("price").value = p.price ?? 0;
    $("description").value = p.description || "";
    $("image_url").value = p.image_url || "";
    $("stock_quantity").value = p.stock_quantity ?? 0;
    $("is_active").checked = p.is_active !== false;
    $("imageFile").value = "";
    $("formTitle").textContent = "Edit Product";
    $("saveBtn").textContent = "Update Product";
    $("cancelBtn").classList.remove("hidden");
    status("Editing: " + (p.name || "product"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function uploadImage(file) {
    if (!file) return null;

    const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
    if (!allowed.includes(file.type)) throw new Error("Choose a JPG, PNG, WEBP or GIF image.");
    if (file.size > 5 * 1024 * 1024) throw new Error("Image must be smaller than 5 MB.");

    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

    const { error } = await db.storage.from("product-images").upload(path, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });
    if (error) throw error;

    const { data } = db.storage.from("product-images").getPublicUrl(path);
    return data.publicUrl;
  }

  $("loginBtn").addEventListener("click", async () => {
    if (!db) return;
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      alert("Enter your admin email and password.");
      return;
    }

    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "Signing in...";
    const { error } = await db.auth.signInWithPassword({ email, password });
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Log In";

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }
    showDashboard(true);
    await loadProducts();
  });

  $("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    showDashboard(false);
    resetForm();
  });

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!db) return;

    const save = $("saveBtn");
    save.disabled = true;
    save.textContent = "Saving...";
    status("Saving product...");

    try {
      let imageUrl = $("image_url").value.trim();
      const file = $("imageFile").files[0];
      if (file) imageUrl = await uploadImage(file);

      const product = {
        name: $("name").value.trim(),
        category: $("category").value,
        price: Number($("price").value),
        description: $("description").value.trim(),
        image_url: imageUrl || null,
        stock_quantity: Math.max(0, parseInt($("stock_quantity").value || "0", 10)),
        is_active: $("is_active").checked,
        updated_at: new Date().toISOString()
      };

      let result;
      if (editingId !== null) {
        result = await db.from("products").update(product).eq("id", editingId);
      } else {
        result = await db.from("products").insert(product);
      }

      if (result.error) throw result.error;

      resetForm();
      status("Product saved successfully.");
      await loadProducts();
    } catch (error) {
      status("Error: " + (error.message || "Something went wrong."));
    } finally {
      save.disabled = false;
      save.textContent = editingId !== null ? "Update Product" : "Save Product";
    }
  });

  async function deleteProduct(p) {
    if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
    const { error } = await db.from("products").delete().eq("id", p.id);
    if (error) {
      alert("Delete failed: " + error.message);
      return;
    }
    await loadProducts();
  }

  $("cancelBtn").addEventListener("click", resetForm);
  $("refreshBtn").addEventListener("click", loadProducts);
  $("filter").addEventListener("input", renderProducts);

  if (SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE") {
    alert("Before using the dashboard, open admin.html in GitHub and replace PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE with your Supabase sb_publishable_ key.");
  } else {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    db.auth.getSession().then(async ({ data, error }) => {
      if (error) {
        alert("Could not check login session: " + error.message);
        return;
      }
      if (data.session) {
        showDashboard(true);
        await loadProducts();
      }
    });
  }
})();
</script>
</body>
</html>
