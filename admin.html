
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Mobile | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#f4f7ff;font-family:Arial,sans-serif;padding:20px}
main{max-width:1000px;margin:25px auto}
.card{background:#10223b;border:1px solid #294463;border-radius:16px;padding:20px;margin-bottom:18px}
h1,h2{color:#70b3ff}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #385575;background:#071426;color:white;font-size:15px}
button{background:#1976e9;border:0;font-weight:bold;cursor:pointer}
button.danger{background:#b83245}
button.secondary{background:#34516f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hidden{display:none}
.product{padding:12px;border:1px solid #294463;border-radius:12px;margin:10px 0;display:grid;grid-template-columns:75px 1fr;gap:12px;align-items:center}
.product img{width:75px;height:75px;object-fit:cover;border-radius:8px;background:#203650}
.small{font-size:13px;color:#b9cce2}
#status{white-space:pre-wrap;color:#9ed0ff}
  
/* PRIME MOBILE — DARK GLASS EDITION */
:root {
  --glass-bg: rgba(15, 28, 55, 0.68);
  --glass-border: rgba(125, 180, 255, 0.22);
  --glass-blue: #3995ff;
}

body {
  background:
    radial-gradient(ellipse at 15% 10%, rgba(0, 105, 255, 0.20), transparent 42%),
    radial-gradient(ellipse at 85% 65%, rgba(0, 200, 255, 0.10), transparent 38%),
    #060b16 !important;
  color: #f3f7ff;
}

header, nav, .header, .navbar {
  background: rgba(8, 17, 36, 0.68) !important;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid var(--glass-border);
}

.product, .product-card, .card, .category,
section, .cart, .search-box {
  background: var(--glass-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.22);
}

button, .btn, .button {
  border-radius: 12px;
  transition: all 0.25s ease;
}

button:hover, .btn:hover, .button:hover {
  box-shadow: 0 0 22px rgba(57, 149, 255, 0.30);
  transform: translateY(-2px);
}

input, select, textarea {
  background: rgba(10, 20, 40, 0.75) !important;
  color: #ffffff !important;
  border: 1px solid var(--glass-border) !important;
  border-radius: 12px !important;
}

img {
  border-radius: 14px;
}

</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Prime Mobile</h1>
    <p>Store Administration</p>
    <p class="small">Sign in to manage products in your Supabase database.</p>
  </section>

  <section class="card" id="login">
    <h2>Admin Login</h2>
    <input id="url" type="url" value="https://jkdlqtmspsxssxpotnhr.supabase.co" placeholder="Supabase Project URL">
    <input id="key" type="password" placeholder="sb_publishable_...">
    <input id="email" type="email" placeholder="Your Supabase account email" autocomplete="username">
    <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
    <button id="loginBtn" type="button">Sign In</button>
  </section>

  <section class="card hidden" id="dashboard">
    <div class="grid">
      <div><h2>Products</h2></div>
      <div><button class="secondary" id="refreshBtn" type="button">Refresh Products</button></div>
      <div><button class="danger" id="logoutBtn" type="button">Sign Out</button></div>
    </div>
    <p id="status">Ready.</p>
  </section>

  <section class="card hidden" id="editor">
    <h2 id="formTitle">Add Product</h2>
    <form id="productForm">
      <input id="productId" type="hidden">
      <label>Product name</label>
      <input id="name" required maxlength="120" placeholder="e.g. Moxom Fast Charger">
      <label>Category</label>
      <select id="category">
        <option>Accessories</option>
        <option>Phones</option>
        <option>Recharge & Internet</option>
        <option>Services</option>
      </select>
      <label>Price (USD)</label>
      <input id="price" type="number" min="0" step="0.01" required placeholder="8.00">
      <label>Stock quantity</label>
      <input id="stock" type="number" min="0" step="1" required value="0">
      <label>Description</label>
      <textarea id="description" rows="3" placeholder="Product details and warranty"></textarea>
      <label>Product photo</label>
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
      <label><input id="active" type="checkbox" checked style="width:auto"> Show in store</label>
      <button id="saveBtn" type="submit">Save Product</button>
      <button class="secondary" id="cancelBtn" type="button">Clear Form</button>
    </form>
  </section>

  <section class="card hidden" id="listSection">
    <h2>Product Inventory</h2>
    <div id="products"></div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let db = null;
  let currentUser = null;
  let products = [];

  function status(message) {
    $("status").textContent = message;
  }

  function showDashboard(show) {
    $("login").classList.toggle("hidden", show);
    $("dashboard").classList.toggle("hidden", !show);
    $("editor").classList.toggle("hidden", !show);
    $("listSection").classList.toggle("hidden", !show);
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;",
      '"':"&quot;", "'":"&#39;"
    })[c]);
  }

  function clearForm() {
    $("productForm").reset();
    $("productId").value = "";
    $("stock").value = "0";
    $("active").checked = true;
    $("formTitle").textContent = "Add Product";
    $("saveBtn").textContent = "Save Product";
  }

  async function loadProducts() {
    status("Loading products...");
    const {data, error} = await db.from("products")
      .select("*").order("created_at", {ascending:false});

    if (error) {
      status("Could not load products: " + error.message);
      return;
    }

    products = data || [];
    $("products").innerHTML = products.length ? products.map(p => `
      <article class="product">
        <img src="${escapeHtml(p.image_url || "")}" alt=""
          onerror="this.style.visibility='hidden'">
        <div>
          <strong>${escapeHtml(p.name)}</strong>
          <p class="small">${escapeHtml(p.category)} · $${Number(p.price).toFixed(2)}
          · Stock: ${Number(p.stock_quantity)} · ${p.is_active ? "Active" : "Hidden"}</p>
          <button type="button" data-edit="${p.id}">Edit</button>
          <button type="button" class="danger" data-delete="${p.id}">Delete</button>
        </div>
      </article>
    `).join("") : "<p>No products found yet.</p>";

    status("Loaded " + products.length + " products.");
  }

  $("loginBtn").addEventListener("click", async () => {
    const projectUrl = $("url").value.trim().replace(/\/+$/, "");
    const publishableKey = $("key").value.trim();
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(projectUrl) ||
        !publishableKey.startsWith("sb_publishable_") ||
        !email || !password) {
      alert("Enter your Project URL, sb_publishable key, email and password.");
      return;
    }

    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "Signing in...";

    try {
      db = window.supabase.createClient(projectUrl, publishableKey);
      const {data, error} = await db.auth.signInWithPassword({email, password});

      if (error) throw error;
      currentUser = data.user;

      if (!currentUser) throw new Error("No user returned.");

      showDashboard(true);
      $("key").value = "";
      $("password").value = "";
      await loadProducts();
    } catch (error) {
      alert("Sign-in failed: " + error.message);
    } finally {
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "Sign In";
    }
  });

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!db || !currentUser) return;

    const saveButton = $("saveBtn");
    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    let uploadedPath = null;

    try {
      const id = $("productId").value;
      let imageUrl = id
        ? (products.find(p => String(p.id) === id)?.image_url || null)
        : null;

      const file = $("photo").files[0];

      if (file) {
        if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
          throw new Error("Use a JPG, PNG or WebP image.");
        }
        if (file.size > 5 * 1024 * 1024) {
          throw new Error("Image must be smaller than 5 MB.");
        }

        const ext = file.type === "image/png" ? "png" :
                    file.type === "image/webp" ? "webp" : "jpg";
        const path = currentUser.id + "/" + crypto.randomUUID() + "." + ext;

        const {error: uploadError} = await db.storage
          .from("product-images")
          .upload(path, file, {contentType:file.type, upsert:false});

        if (uploadError) throw uploadError;
        uploadedPath = path;

        const {data: publicData} = db.storage
          .from("product-images").getPublicUrl(path);
        imageUrl = publicData.publicUrl;
      }

      const item = {
        name: $("name").value.trim(),
        category: $("category").value,
        price: Number($("price").value),
        description: $("description").value.trim(),
        stock_quantity: Number($("stock").value),
        is_active: $("active").checked,
        image_url: imageUrl,
        updated_at: new Date().toISOString()
      };

      if (!item.name || !Number.isFinite(item.price) || item.price < 0 ||
          !Number.isInteger(item.stock_quantity) || item.stock_quantity < 0) {
        throw new Error("Check the name, price and stock quantity.");
      }

      const result = id
        ? await db.from("products").update(item).eq("id", Number(id)).select()
        : await db.from("products").insert(item).select();

      if (result.error) throw result.error;
      if (!result.data || result.data.length === 0) {
        throw new Error("No row was saved. Check your account permissions.");
      }

      clearForm();
      await loadProducts();
      status("Product saved successfully.");
    } catch (error) {
      status("Save failed: " + error.message);
      alert("Save failed: " + error.message);
      if (uploadedPath) {
        status("Upload completed, but product save failed. Image path: " + uploadedPath);
      }
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "Save Product";
    }
  });

  $("products").addEventListener("click", async event => {
    const editId = event.target.dataset.edit;
    const deleteId = event.target.dataset.delete;

    if (editId) {
      const p = products.find(x => String(x.id) === editId);
      if (!p) return;

      $("productId").value = p.id;
      $("name").value = p.name || "";
      $("category").value = p.category || "Accessories";
      $("price").value = p.price;
      $("stock").value = p.stock_quantity ?? 0;
      $("description").value = p.description || "";
      $("active").checked = !!p.is_active;
      $("photo").value = "";
      $("formTitle").textContent = "Edit Product";
      $("saveBtn").textContent = "Update Product";
      window.scrollTo({top:0, behavior:"smooth"});
    }

    if (deleteId) {
      const p = products.find(x => String(x.id) === deleteId);
      if (!p || !confirm("Delete " + p.name + "? This cannot be undone.")) return;

      const {error} = await db.from("products").delete().eq("id", Number(deleteId));
      if (error) {
        alert("Delete failed: " + error.message);
        return;
      }
      await loadProducts();
    }
  });

  $("refreshBtn").addEventListener("click", loadProducts);
  $("cancelBtn").addEventListener("click", clearForm);

  $("logoutBtn").addEventListener("click", async () => {
    if (db) await db.auth.signOut();
    currentUser = null;
    products = [];
    showDashboard(false);
    $("products").innerHTML = "";
    status("Signed out.");
  });
})();
</script>
</body>
</html>
